{% extends 'base.html' %} {% block title %} All Posts {% endblock %} {% block
content %}

<section class="hero">
  <div class="hero-body">
    <div class="container">
      <div class="columns is-multiline">
        {% for post in pages.items %}
        <div class="column is-one-quarter"></div>
        <div class="column is-half">
          {% include 'posts/includes/card.html' %}

          <br />
        </div>
        <div class="column is-one-quarter"></div>
        {% endfor %}
        <div class="column is-one-quarter"></div>
        <div class="column is-half">
          <nav class="pagination" role="navigation" aria-label="pagination">
            <button
              class="pagination-previous"
              {%
              if
              not
              pages.has_prev
              %}
              disabled
              {%
              endif
              %}
            >
              <a href="./?page={{ pages.prev_num }}">Previous</a>
            </button>
            <button
              class="pagination-next"
              {%
              if
              not
              pages.has_next
              %}
              disabled
              {%
              endif
              %}
            >
              <a href="./?page={{ pages.next_num }}">Next page</a>
            </button>
            <ul class="pagination-list">
              {% for page in pages.iter_pages() %}
              <li>
                <a
                  class="
                    pagination-link
                    {%
                    if
                    page
                    ==
                    pages.page
                    %}
                    is-current
                    {%
                    endif
                    %}
                  "
                  aria-label="Page 46"
                  aria-current="page"
                  href="./?page={{ page }}"
                  >{{ page}}</a
                >
              </li>
              {% endfor %}
            </ul>
          </nav>
        </div>
        <div class="column is-one-quarter"></div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
